name: Objavi Android APK

# Nalozi APK v predizdajo `android` pod stalnim imenom racunko-pos.apk
# (gumb Nastavitve → Prenosi, apps/web/lib/prenosi.ts).
#
# Sprozi se, ko se na main spremeni apps/mobile/android-izdaja.json - vanj
# vpises povezavo za prenos EAS builda (expo.dev → Builds → build →
# Download → kopiraj povezavo). Rocno: Actions → Objavi Android APK → Run.
#
# Predizdaja nikoli ne postane "latest", zato ne vpliva na samodejne
# posodobitve namizne aplikacije (electron-updater bere /releases/latest).

on:
  push:
    branches: [main]
    paths: ['apps/mobile/android-izdaja.json', '.github/workflows/android-apk.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OZNAKA: android
    steps:
      - uses: actions/checkout@v4

      - name: Preberi povezavo
        id: vir
        run: |
          URL=$(jq -r '.apk_url // ""' apps/mobile/android-izdaja.json)
          if [ -z "$URL" ]; then
            echo "apk_url je prazen - nic za objaviti."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$URL" in
            https://expo.dev/artifacts/*) ;;
            *) echo "::error::apk_url mora biti povezava EAS (https://expo.dev/artifacts/...)"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Prenesi in preveri APK
        if: steps.vir.outputs.url != ''
        id: apk
        run: |
          curl -fL --retry 3 -o racunko-pos.apk "${{ steps.vir.outputs.url }}"
          VELIKOST=$(stat -c %s racunko-pos.apk)
          [ "$VELIKOST" -gt 1000000 ] || { echo "::error::APK je sumljivo majhen ($VELIKOST B)"; exit 1; }
          unzip -l racunko-pos.apk | grep -q AndroidManifest.xml || { echo "::error::Datoteka ni APK"; exit 1; }

          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)aapt2
          if [ -x "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging racunko-pos.apk | head -1)
            echo "$BADGING"
            PAKET=$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            KODA=$(echo "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
            IME=$(echo "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
            [ "$PAKET" = "si.racunko.pos" ] || { echo "::error::Napacen paket: $PAKET"; exit 1; }
            VERZIJA="$IME ($KODA)"
          else
            echo "::warning::aapt2 ni na voljo - razlicica ne bo izpisana"
            VERZIJA=""
          fi

          jq -n --arg v "$VERZIJA" --argjson s "$VELIKOST" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{verzija: (if $v == "" then null else $v end), velikost: $s, datum: $d}' > racunko-pos-android.json
          cat racunko-pos-android.json
          echo "verzija=$VERZIJA" >> "$GITHUB_OUTPUT"

      - name: Objavi v predizdajo android
        if: steps.vir.outputs.url != ''
        run: |
          if ! gh release view "$OZNAKA" >/dev/null 2>&1; then
            gh release create "$OZNAKA" --prerelease --latest=false --target main \
              --title "Računko POS za Android" \
              --notes "Stalno mesto za Android aplikacijo. Prenos: Računko → Nastavitve → Prenosi."
          fi
          gh release edit "$OZNAKA" --prerelease --latest=false \
            --title "Računko POS za Android" \
            --notes "Stalno mesto za Android aplikacijo. Prenos: Računko → Nastavitve → Prenosi. Objavlja: .github/workflows/android-apk.yml"
          gh release upload "$OZNAKA" racunko-pos.apk racunko-pos-android.json --clobber
          echo "✓ Objavljeno: ${{ steps.apk.outputs.verzija }}" >> "$GITHUB_STEP_SUMMARY"
