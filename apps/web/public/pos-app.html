// Variant 3 — PULSE
// Dark mode, high contrast, big tap targets. For bars, busy markets,
// high-volume environments where speed and visibility from afar matter.
// Inspired by Loyverse, Storyous, late-night POS terminals.

const PULSE_THEME = {
  bg:          '#0d1112',
  surface:     '#171c1e',
  surface2:    '#1f2628',
  surface3:    '#2a3236',
  ink:         '#eef2f3',
  inkSoft:     '#c5cccf',
  muted:       '#7a838a',
  line:        'rgba(255,255,255,0.07)',
  lineSoft:    'rgba(255,255,255,0.04)',
  header:      '#0a0d0e',
  headerInk:   '#eef2f3',
  brand:       '#39ff88',
  accent:      '#39ff88',
  accentText:  '#06160d',
  accentSoft:  'rgba(57,255,136,0.15)',
  danger:      '#ff5577',
  chipBg:      '#1f2628',
  modalBg:     '#171c1e',
  modalText:   '#eef2f3',
  modalBorder: '1px solid rgba(255,255,255,0.08)',
  modalShadow: '0 30px 80px rgba(0,0,0,0.6)',
  scrim:       'rgba(0,0,0,0.7)',
  inputBg:     '#0d1112',
  summaryBg:   '#0d1112',
  text:        '#eef2f3',
  status: {
    free:      { bg:'rgba(255,255,255,0.03)', stroke:'rgba(57,255,136,0.35)', dot:'#39ff88', label:'Prosto' },
    occupied:  { bg:'rgba(255,193,71,0.12)',  stroke:'rgba(255,193,71,0.55)', dot:'#ffc147', label:'Zasedeno' },
    reserved:  { bg:'rgba(155,127,255,0.12)', stroke:'rgba(155,127,255,0.55)', dot:'#9b7fff', label:'Rezerv.' },
    needs_attention: { bg:'rgba(255,85,119,0.15)', stroke:'rgba(255,85,119,0.6)', dot:'#ff5577', label:'Pozor' },
  },
};

function PosPulse() {
  const T = PULSE_THEME;
  const I = window.PosIcon;
  const [mode, setMode] = useState('sale');
  const [selectedSpace, setSelectedSpace] = useState(D.spaces[0].id);
  const [activeTable, setActiveTable] = useState(null);
  const [selectedCat, setSelectedCat] = useState('cat-fav');
  const [search, setSearch] = useState('');
  const [cart, setCart] = useState([]);
  const [modifierItem, setModifierItem] = useState(null);
  const [paymentOpen, setPaymentOpen] = useState(false);
  const [receipt, setReceipt] = useState(null);
  const [now, setNow] = useState(new Date());

  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);

  const space = D.spaces.find(s => s.id === selectedSpace);
  const items = useMemo(() => {
    let arr = window.posHelpers.itemsIn(selectedCat);
    if (search) arr = D.items.filter(i =>
      i.name.toLowerCase().includes(search.toLowerCase()) ||
      i.code.toLowerCase().includes(search.toLowerCase()));
    return arr;
  }, [selectedCat, search]);
  const totals = window.posHelpers.orderTotals(cart);

  function addItem(item) {
    if (D.modifierGroups[item.cat]) { setModifierItem(item); return; }
    setCart(c => {
      const idx = c.findIndex(l => l.id === item.id && (!l.mods || l.mods.length === 0));
      if (idx >= 0) { const cp = [...c]; cp[idx] = { ...cp[idx], qty: cp[idx].qty + 1 }; return cp; }
      return [...c, { lineId: Math.random().toString(36).slice(2), id: item.id, name: item.name, price: item.price, qty: 1, mods: [], unit: item.unit }];
    });
  }
  function adjustQty(lineId, delta) {
    setCart(c => c.flatMap(l => l.lineId === lineId ? (l.qty + delta <= 0 ? [] : [{ ...l, qty: l.qty + delta }]) : [l]));
  }

  return (
    <div style={{
      width: '100%', height: '100%', background: T.bg, color: T.ink,
      fontFamily: '"Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif',
      fontSize: 13, display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      {/* Header */}
      <div style={{
        background: T.header, padding: '10px 18px', display: 'flex', alignItems: 'center', gap: 14,
        borderBottom: `1px solid ${T.line}`, flexShrink: 0,
      }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
          <div style={{ color: T.accent, fontWeight: 800, fontSize: 16, letterSpacing: '-0.02em' }}>RAČUNKO</div>
          <div style={{ color: T.muted, fontSize: 12 }}>· {D.business.name}</div>
        </div>

        <div style={{ marginLeft: 16, display: 'flex', gap: 2, background: T.surface, borderRadius: 10, padding: 3 }}>
          {[
            { id: 'sale',  label: 'Prodaja', icon: 'grid' },
            { id: 'floor', label: 'Mize',    icon: 'chair' },
          ].map(t => (
            <button key={t.id} onClick={() => { setMode(t.id); if (t.id === 'sale') setActiveTable(null); }} style={{
              background: mode === t.id ? T.accent : 'transparent',
              color: mode === t.id ? T.accentText : T.ink,
              border: 'none', padding: '7px 14px', borderRadius: 8, cursor: 'pointer',
              fontFamily: 'inherit', fontWeight: 700, fontSize: 12,
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <I name={t.icon} size={14}/> {t.label}
            </button>
          ))}
        </div>

        {activeTable && (
          <div style={{
            background: 'rgba(255,193,71,0.15)', color: '#ffc147',
            padding: '6px 12px', borderRadius: 8, fontSize: 12, fontWeight: 700,
            display: 'flex', alignItems: 'center', gap: 6, border: '1px solid rgba(255,193,71,0.3)',
          }}>
            <I name="chair" size={13}/> {activeTable.name}
            <button onClick={() => setActiveTable(null)} style={{
              background: 'transparent', border: 'none', color: 'inherit', cursor: 'pointer',
              padding: 0, marginLeft: 4, display: 'flex',
            }}><I name="x" size={12}/></button>
          </div>
        )}

        {/* Live stats — bold differentiator */}
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 18 }}>
          <Stat label="Promet" value="€ 487" color={T.accent}/>
          <Stat label="Računi" value="34" color={T.ink}/>
          <Stat label="Vmesna" value={eur(totals.total)} color={cart.length > 0 ? T.accent : T.muted}/>
          <div style={{ width: 1, height: 26, background: T.line }}/>
          <div style={{ fontSize: 13, fontWeight: 700, fontVariantNumeric: 'tabular-nums', color: T.ink }}>
            {String(now.getHours()).padStart(2,'0')}:{String(now.getMinutes()).padStart(2,'0')}
          </div>
          <button style={{
            background: T.surface, border: 'none', color: T.ink,
            padding: '7px 12px', borderRadius: 8, cursor: 'pointer', fontFamily: 'inherit',
            fontSize: 12, fontWeight: 700,
          }}>{D.business.cashier}</button>
        </div>
      </div>

      {/* Body */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden', minHeight: 0 }}>
        {mode === 'floor' ? (
          <PulseFloorView T={T} space={space} selectedSpace={selectedSpace}
            setSelectedSpace={setSelectedSpace}
            onPickTable={(t) => { setActiveTable(t); setMode('sale'); }} />
        ) : (
          <>
            {/* Left rail: categories icons */}
            <div style={{
              width: 84, background: T.surface, borderRight: `1px solid ${T.line}`,
              display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '10px 0', gap: 4, flexShrink: 0,
              overflowY: 'auto',
            }}>
              {D.categories.map(c => {
                const active = selectedCat === c.id;
                return (
                  <button key={c.id} onClick={() => { setSelectedCat(c.id); setSearch(''); }}
                    title={c.name} style={{
                      width: 64, padding: '10px 4px', borderRadius: 10, cursor: 'pointer',
                      background: active ? T.surface3 : 'transparent', border: 'none',
                      color: T.ink, fontFamily: 'inherit',
                      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                      position: 'relative',
                  }}>
                    {active && <span style={{
                      position: 'absolute', left: -4, top: 12, bottom: 12, width: 3, borderRadius: 2,
                      background: T.accent,
                    }}/>}
                    <span style={{ fontSize: 22 }}>{c.icon}</span>
                    <span style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em',
                                    color: active ? T.accent : T.muted, textAlign: 'center', lineHeight: 1.1 }}>
                      {c.name.split(' ')[0]}
                    </span>
                  </button>
                );
              })}
            </div>

            {/* Center: search + items */}
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
              <div style={{ padding: '12px 16px', display: 'flex', gap: 10, alignItems: 'center',
                            borderBottom: `1px solid ${T.line}` }}>
                <div style={{ position: 'relative', flex: 1 }}>
                  <div style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: T.muted }}>
                    <I name="search" size={16}/>
                  </div>
                  <input value={search} onChange={e => setSearch(e.target.value)}
                    placeholder="Išči ali skeniraj…" style={{
                      width: '100%', padding: '11px 12px 11px 38px', borderRadius: 10,
                      border: `1px solid ${T.line}`, fontFamily: 'inherit', fontSize: 14,
                      background: T.surface, color: T.ink, outline: 'none', boxSizing: 'border-box',
                  }}/>
                </div>
                <button style={{
                  width: 44, height: 44, borderRadius: 10, cursor: 'pointer', fontFamily: 'inherit',
                  border: 'none', background: T.surface, color: T.ink,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}><I name="barcode" size={20}/></button>
                <button style={{
                  padding: '0 16px', height: 44, borderRadius: 10, cursor: 'pointer', fontFamily: 'inherit',
                  border: 'none', background: T.surface3, color: T.ink,
                  fontWeight: 700, fontSize: 13, display: 'flex', alignItems: 'center', gap: 6,
                }}>+ Ročno</button>
              </div>

              <div style={{
                flex: 1, overflowY: 'auto', padding: 12,
                display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(132px, 1fr))', gap: 8,
                alignContent: 'start',
              }}>
                {items.map(it => {
                  const itemCat = D.categories.find(c => c.id === it.cat);
                  return (
                    <button key={it.id} onClick={() => addItem(it)} style={{
                      background: T.surface, border: `1px solid ${T.line}`,
                      borderLeft: `3px solid ${itemCat?.color}`,
                      borderRadius: 10,
                      padding: '14px 12px 12px', cursor: 'pointer', textAlign: 'left',
                      fontFamily: 'inherit', color: T.ink,
                      display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
                      minHeight: 96, position: 'relative',
                      transition: 'transform .08s, background .12s',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = T.surface2}
                    onMouseLeave={e => e.currentTarget.style.background = T.surface}>
                      {it.fav && <span style={{
                        position: 'absolute', top: 8, right: 10, color: T.brand, fontSize: 12,
                      }}>★</span>}
                      <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.25 }}>{it.name}</div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: 10 }}>
                        <div style={{ fontSize: 17, fontWeight: 800, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.01em' }}>{eur(it.price)}</div>
                        <div style={{ fontSize: 9, color: T.muted, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{it.code}</div>
                      </div>
                    </button>
                  );
                })}
                {items.length === 0 && (
                  <div style={{ gridColumn: '1 / -1', padding: 40, textAlign: 'center', color: T.muted }}>
                    Ni rezultatov.
                  </div>
                )}
              </div>
            </div>

            {/* Cart */}
            <PulseCartPanel T={T} I={I} cart={cart} totals={totals} activeTable={activeTable}
              adjustQty={adjustQty} onPay={() => setPaymentOpen(true)} clearCart={() => setCart([])} />
          </>
        )}
      </div>

      <ModifierModal item={modifierItem} theme={T}
        onCancel={() => setModifierItem(null)}
        onConfirm={({ qty, mods, note }) => {
          const it = modifierItem;
          setCart(c => [...c, { lineId: Math.random().toString(36).slice(2), id: it.id, name: it.name,
                                price: it.price, qty, mods, note, unit: it.unit }]);
          setModifierItem(null);
        }}/>
      <PaymentModal open={paymentOpen} total={totals.total} theme={T}
        onCancel={() => setPaymentOpen(false)}
        onComplete={(data) => { setPaymentOpen(false); setReceipt(data); setCart([]); setActiveTable(null); }}/>
      <ReceiptToast data={receipt} onClose={() => setReceipt(null)} theme={T}/>
    </div>
  );
}

function Stat({ label, value, color }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end' }}>
      <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.45)', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 700 }}>{label}</div>
      <div style={{ fontSize: 14, fontWeight: 800, color, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.01em' }}>{value}</div>
    </div>
  );
}

function PulseFloorView({ T, space, selectedSpace, setSelectedSpace, onPickTable }) {
  const I = window.PosIcon;
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0, padding: 16 }}>
      <div style={{ display: 'flex', gap: 10, marginBottom: 14, alignItems: 'center' }}>
        <div style={{ display: 'flex', gap: 4, background: T.surface, padding: 4, borderRadius: 10 }}>
          {D.spaces.map(s => (
            <button key={s.id} onClick={() => setSelectedSpace(s.id)} style={{
              padding: '8px 16px', borderRadius: 7, cursor: 'pointer', fontFamily: 'inherit',
              border: 'none', fontWeight: 700, fontSize: 13,
              background: selectedSpace === s.id ? T.surface3 : 'transparent',
              color: selectedSpace === s.id ? T.ink : T.muted,
              display: 'flex', alignItems: 'center', gap: 8,
            }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: s.color }}/>
              {s.name}
              <span style={{ opacity: 0.6, fontSize: 11, fontWeight: 500 }}>
                {s.tables.filter(t => t.status === 'occupied').length}/{s.tables.length}
              </span>
            </button>
          ))}
        </div>

        <div style={{ display: 'flex', gap: 10, marginLeft: 'auto' }}>
          {Object.entries(T.status).map(([k, st]) => (
            <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: T.muted, fontWeight: 600 }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: st.dot }}/>
              {st.label}
            </div>
          ))}
        </div>

        <button onClick={() => onPickTable(null)} style={{
          padding: '8px 16px', borderRadius: 10, cursor: 'pointer', fontFamily: 'inherit',
          background: T.accent, color: T.accentText, border: 'none', fontWeight: 800, fontSize: 13,
          display: 'flex', alignItems: 'center', gap: 6,
        }}>
          <I name="plus" size={15}/> Hitra prodaja
        </button>
      </div>

      <div style={{ flex: 1, position: 'relative', overflow: 'hidden',
                     background: T.surface, borderRadius: 14,
                     backgroundImage: 'radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px)',
                     backgroundSize: '24px 24px',
                     border: `1px solid ${T.line}` }}>
        {space.tables.map(t => {
          const st = T.status[t.status];
          const isRound = t.seats <= 2;
          const w = t.seats <= 2 ? 92 : t.seats <= 4 ? 116 : 152;
          const h = t.seats <= 2 ? 92 : t.seats <= 4 ? 92 : 116;
          return (
            <button key={t.id} onClick={() => onPickTable(t)} style={{
              position: 'absolute',
              left: `${t.x}%`, top: `${t.y}%`,
              width: w, height: h,
              background: st.bg,
              border: `2px solid ${st.stroke}`,
              borderRadius: isRound ? '50%' : 14,
              cursor: 'pointer', fontFamily: 'inherit', color: T.ink,
              padding: 8, textAlign: 'center',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              gap: 2,
            }}>
              <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: '-0.01em' }}>{t.name}</div>
              <div style={{ fontSize: 10, color: T.muted, display: 'flex', alignItems: 'center', gap: 3 }}>
                <I name="user" size={10}/> {t.seats}
              </div>
              {t.status === 'occupied' && (
                <>
                  <div style={{ fontSize: 14, fontWeight: 800, fontVariantNumeric: 'tabular-nums', marginTop: 2, color: '#ffc147' }}>{eur(t.order)}</div>
                  <div style={{ fontSize: 9, color: T.muted }}>{t.since} · {t.server}</div>
                </>
              )}
              {t.status === 'needs_attention' && (
                <div style={{ position: 'absolute', top: -8, right: -8, width: 24, height: 24, borderRadius: 999,
                              background: st.dot, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 800,
                              boxShadow: '0 0 0 3px ' + T.bg }}>!</div>
              )}
              {t.status === 'reserved' && (
                <div style={{ fontSize: 9, color: T.muted, padding: '0 2px', lineHeight: 1.2 }}>{t.reservedFor}</div>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function PulseCartPanel({ T, I, cart, totals, activeTable, adjustQty, onPay, clearCart }) {
  return (
    <div style={{
      width: 340, background: T.surface, borderLeft: `1px solid ${T.line}`,
      display: 'flex', flexDirection: 'column', flexShrink: 0,
    }}>
      <div style={{ padding: '14px 16px', borderBottom: `1px solid ${T.line}`,
                    display: 'flex', alignItems: 'center', gap: 8 }}>
        <div>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.08em',
                        color: T.muted, fontWeight: 700 }}>Naročilo</div>
          <div style={{ fontWeight: 800, fontSize: 15, marginTop: 2, color: T.ink, letterSpacing: '-0.01em' }}>
            {activeTable ? activeTable.name : 'Hitra prodaja'}
            <span style={{ color: T.muted, fontWeight: 500, fontSize: 12 }}>
              &nbsp;· {cart.reduce((s,l) => s + l.qty, 0)}
            </span>
          </div>
        </div>
        {cart.length > 0 && (
          <button onClick={clearCart} style={{
            marginLeft: 'auto', padding: '6px 10px', borderRadius: 8, background: T.surface3,
            border: 'none', color: T.muted, cursor: 'pointer', fontFamily: 'inherit',
            fontSize: 11, fontWeight: 700,
          }}>POČISTI</button>
        )}
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: cart.length === 0 ? 0 : 0 }}>
        {cart.length === 0 && (
          <div style={{ padding: 50, textAlign: 'center', color: T.muted, fontSize: 13 }}>
            <div style={{ fontSize: 32, marginBottom: 10, opacity: 0.3 }}>⚡</div>
            <div style={{ fontWeight: 700, color: T.inkSoft, marginBottom: 4 }}>Pripravljeno</div>
            <div style={{ fontSize: 12 }}>Tapni artikel za začetek.</div>
          </div>
        )}
        {cart.map((l, idx) => (
          <div key={l.lineId} style={{
            padding: '11px 14px',
            borderBottom: `1px solid ${T.lineSoft}`,
            display: 'flex', gap: 10, alignItems: 'flex-start',
          }}>
            <div style={{
              minWidth: 28, height: 28, borderRadius: 7, background: T.accent, color: T.accentText,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontWeight: 800, fontSize: 13, fontVariantNumeric: 'tabular-nums', flexShrink: 0,
              padding: '0 6px',
            }}>{l.qty}×</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.3, color: T.ink }}>{l.name}</div>
              {l.mods && l.mods.length > 0 && (
                <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>{l.mods.map(m => m.name).join(' · ')}</div>
              )}
              {l.note && (
                <div style={{ fontSize: 11, color: T.muted, marginTop: 2, fontStyle: 'italic' }}>"{l.note}"</div>
              )}
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6 }}>
                <button onClick={() => adjustQty(l.lineId, -1)} style={{
                  width: 24, height: 24, borderRadius: 6, border: 'none', background: T.surface3,
                  cursor: 'pointer', color: T.ink, display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}><I name="minus" size={11}/></button>
                <button onClick={() => adjustQty(l.lineId, 1)} style={{
                  width: 24, height: 24, borderRadius: 6, border: 'none', background: T.surface3,
                  cursor: 'pointer', color: T.ink, display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}><I name="plus" size={11}/></button>
                <div style={{ marginLeft: 'auto', fontWeight: 800, fontSize: 14,
                              fontVariantNumeric: 'tabular-nums', color: T.ink }}>
                  {eur(window.posHelpers.lineTotal(l))}
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Big total */}
      <div style={{ padding: '16px 16px 8px', background: T.bg, borderTop: `1px solid ${T.line}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
          <div style={{ fontSize: 11, color: T.muted, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em' }}>
            Skupaj · DDV vključen
          </div>
          <div style={{ fontSize: 11, color: T.muted, fontVariantNumeric: 'tabular-nums' }}>
            DDV {eur(totals.ddv)}
          </div>
        </div>
        <div style={{ fontSize: 44, fontWeight: 900, color: T.accent, lineHeight: 1, fontVariantNumeric: 'tabular-nums',
                       letterSpacing: '-0.03em', fontFamily: '"Inter", -apple-system, sans-serif' }}>
          {eur(totals.total)}
        </div>
      </div>

      {/* Action grid */}
      <div style={{ padding: '8px 12px 12px', background: T.bg }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6, marginBottom: 8 }}>
          {[
            { icon: 'percent', label: 'Popust' },
            { icon: 'user',    label: 'Stranka' },
            { icon: 'split',   label: 'Razdeli' },
            { icon: 'edit',    label: 'Opomba' },
          ].map(b => (
            <button key={b.label} style={{
              padding: '8px 4px', borderRadius: 8, background: T.surface, border: 'none',
              cursor: 'pointer', color: T.inkSoft, fontFamily: 'inherit',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
              fontSize: 10, fontWeight: 700,
            }}>
              <I name={b.icon} size={15}/>{b.label}
            </button>
          ))}
        </div>
        <button disabled={cart.length === 0} onClick={onPay} style={{
          width: '100%', padding: '16px', borderRadius: 12,
          cursor: cart.length ? 'pointer' : 'not-allowed', fontFamily: 'inherit',
          border: 'none',
          background: cart.length ? T.accent : T.surface3,
          color: cart.length ? T.accentText : T.muted,
          fontWeight: 800, fontSize: 15, letterSpacing: '0.02em',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          textTransform: 'uppercase',
        }}>
          <I name="arrow" size={18} strokeWidth={2.5}/>
          Plačaj {eur(totals.total)}
        </button>
      </div>
    </div>
  );
}

window.PosPulse = PosPulse;

      <TweaksPanel>
        <TweakSection label="Pregled"/>
        <TweakToggle label="Pokaži izhodišča" value={t.showResearch}
          onChange={v => setTweak('showResearch', v)}/>
        <TweakToggle label="Pokaži stare variante (Studio/Pulse)" value={t.showLegacyVariants}
          onChange={v => setTweak('showLegacyVariants', v)}/>
        <TweakSection label="Navodila"/>
        <div style={{ fontSize: 11, color: 'rgba(41,38,27,0.7)', lineHeight: 1.5 }}>
          <b>Klasik v2</b> ima <b>vse funkcije</b>:<br/><br/>
          <b>1.</b> V glavi izberi <b>Tip poslovanja</b> — bar, trgovina, storitve…<br/><br/>
          <b>2.</b> V stranskem meniju klikaj med razdelki: Prostori, Prodaja, Koledar, Stranke, Zaloga, Poročila, Nastavitve.<br/><br/>
          <b>3.</b> Z gumbom <b>⚙️</b> desno zgoraj v POS-u prilagodiš, kaj se vidi v glavi (promet, ura, obvestila…).<br/><br/>
          <b>4.</b> Klikni <b>↗</b> nad artboardom za fullscreen.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
